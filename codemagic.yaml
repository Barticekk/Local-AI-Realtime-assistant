workflows:
  ios-companion:
    name: iOS Companion (Swift)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        # Configure these variable groups in the Codemagic UI under
        # Application > Environment variables:
        #   app_store_credentials: APP_STORE_CONNECT_ISSUER_ID,
        #                          APP_STORE_CONNECT_KEY_IDENTIFIER,
        #                          APP_STORE_CONNECT_PRIVATE_KEY
        #   certificate_credentials: CERTIFICATE_PRIVATE_KEY
        - app_store_credentials
        - certificate_credentials
      vars:
        BUNDLE_ID: "com.barticekk.localairealtimeassistant.companion"
        APP_STORE_APP_ID: "REPLACE_WITH_APP_STORE_APP_ID"  # App Store Connect > App > General > App Information
        XCODE_WORKSPACE: "ios-companion/CompanionApp/CompanionApp.xcworkspace"
        XCODE_SCHEME: "CompanionApp"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Show Xcode version
        script: xcodebuild -version

      - name: Install CocoaPods dependencies (if Podfile exists)
        script: |
          PODFILE="$FCI_BUILD_DIR/ios-companion/CompanionApp/Podfile"
          if [ -f "$PODFILE" ]; then
            cd "$(dirname "$PODFILE")"
            pod install
          else
            echo "No Podfile found — skipping pod install."
          fi

      - name: Initialize keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          # Docs: https://github.com/codemagic-ci-cd/cli-tools/blob/master/docs/app-store-connect/fetch-signing-files.md
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles --warn-only

      - name: Increment build number from latest TestFlight build
        script: |
          set -e
          cd "$FCI_BUILD_DIR/ios-companion/CompanionApp"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo "0")
          agvtool new-version -all $(( LATEST + 1 ))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$FCI_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        # Set to true and configure beta_groups once ready for TestFlight distribution:
        # beta_groups:
        #   - "Internal Testers"
